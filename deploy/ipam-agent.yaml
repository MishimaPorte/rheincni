apiVersion: v1
kind: ServiceAccount
metadata:
  name: rheincni-ipam
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rheincni-ipam
    app.kubernetes.io/part-of: rheincni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rheincni-ipam
  labels:
    app.kubernetes.io/name: rheincni-ipam
    app.kubernetes.io/part-of: rheincni
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rheincni-ipam
  labels:
    app.kubernetes.io/name: rheincni-ipam
    app.kubernetes.io/part-of: rheincni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rheincni-ipam
subjects:
  - kind: ServiceAccount
    name: rheincni-ipam
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rheincni-ipam
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rheincni-ipam
    app.kubernetes.io/part-of: rheincni
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rheincni-ipam
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rheincni-ipam
        app.kubernetes.io/part-of: rheincni
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      serviceAccountName: rheincni-ipam
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
      containers:
        - name: ipam
          image: rheincni-ipam:dev
          imagePullPolicy: Never
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: state
              mountPath: /var/lib/rheincni
            - name: run
              mountPath: /run/rheincni
      volumes:
        - name: state
          hostPath:
            path: /var/lib/rheincni
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /run/rheincni
            type: DirectoryOrCreate
